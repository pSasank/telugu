<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TeluguEasy — Survival Telugu for Hyderabad, speaking in two days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesque:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b2422; --ink-2:#102f2c; --ink-3:#164039;
    --brass:#d9a441; --brass-soft:#ecca85;
    --pearl:#f4efe4; --muted:#9db0a7;
    --rose:#e0795f;
    --line:rgba(244,239,228,.12);
    --line-2:rgba(244,239,228,.07);
    --display:'Fraunces',Georgia,serif;
    --telugu:'Noto Sans Telugu',sans-serif;
    --ui:'Hanken Grotesque',system-ui,-apple-system,sans-serif;
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--pearl);font-family:var(--ui);-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh}
  ::selection{background:var(--brass);color:var(--ink)}

  header{position:sticky;top:0;z-index:50;background:rgba(11,36,34,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .bar{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;margin-right:auto;cursor:default}
  .glyph{font-family:var(--telugu);font-weight:700;font-size:28px;line-height:1;color:var(--ink);background:var(--brass);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(217,164,65,.4),0 8px 22px -10px rgba(217,164,65,.6)}
  .brand h1{font-family:var(--display);font-weight:600;font-size:19px;margin:0;letter-spacing:.2px}
  .brand p{margin:0;font-size:11.5px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
  .search{position:relative;flex:1;min-width:160px;max-width:300px}
  .search input{width:100%;padding:10px 14px 10px 38px;background:var(--ink-2);border:1px solid var(--line);border-radius:11px;color:var(--pearl);font-family:var(--ui);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{border-color:var(--brass);box-shadow:0 0 0 3px rgba(217,164,65,.16)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .hipill{font-family:var(--ui);font-size:13px;font-weight:600;padding:9px 13px;border-radius:11px;cursor:pointer;background:var(--ink-2);border:1px solid var(--line);color:var(--muted);transition:.15s;display:inline-flex;align-items:center;gap:7px}
  .hipill[aria-pressed="true"]{background:var(--brass);color:var(--ink);border-color:var(--brass)}
  .hipill:focus-visible{outline:2px solid var(--brass-soft);outline-offset:2px}
  .hipill .dv{font-weight:700}
  .modes{display:flex;background:var(--ink-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
  .modes button{font-family:var(--ui);font-size:13px;font-weight:600;padding:7px 14px;border:0;border-radius:8px;cursor:pointer;background:transparent;color:var(--muted);transition:.15s}
  .modes button[aria-pressed="true"]{background:var(--brass);color:var(--ink)}
  .modes button:focus-visible{outline:2px solid var(--brass-soft);outline-offset:2px}

  .hero{max-width:1080px;margin:0 auto;padding:40px 20px 6px;position:relative;overflow:hidden}
  .hero .watermark{position:absolute;right:-10px;top:-30px;font-family:var(--telugu);font-weight:700;font-size:230px;line-height:.8;color:rgba(217,164,65,.06);pointer-events:none;user-select:none}
  .hero h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,44px);margin:0 0 8px;letter-spacing:-.5px;line-height:1.06;max-width:18ch}
  .hero h2 em{font-style:normal;color:var(--brass)}
  .hero p{margin:0;color:var(--muted);font-size:15.5px;max-width:56ch}

  .tierbar{max-width:1080px;margin:22px auto 0;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap}
  .tierbtn{flex:1;min-width:150px;text-align:left;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:12px 15px;cursor:pointer;transition:.15s;color:var(--pearl)}
  .tierbtn:hover{border-color:rgba(217,164,65,.4)}
  .tierbtn[aria-pressed="true"]{border-color:var(--brass);background:linear-gradient(180deg,var(--ink-3),var(--ink-2));box-shadow:inset 0 0 0 1px var(--brass)}
  .tierbtn .tname{font-family:var(--display);font-weight:600;font-size:16px;display:flex;align-items:center;gap:9px}
  .tierbtn .tnum{font-size:11px;font-weight:700;color:var(--brass);background:rgba(217,164,65,.16);border-radius:6px;padding:2px 7px;font-family:var(--ui)}
  .tierbtn .tsub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .tierbtn[aria-pressed="true"] .tsub{color:var(--brass-soft)}

  .chips{max-width:1080px;margin:0 auto;padding:18px 20px 4px;display:flex;gap:9px;flex-wrap:wrap}
  .chip{font-family:var(--ui);font-size:13.5px;font-weight:600;padding:8px 15px;border-radius:999px;cursor:pointer;background:var(--ink-2);border:1px solid var(--line);color:var(--muted);transition:.15s;display:inline-flex;align-items:center;gap:7px}
  .chip:hover{color:var(--pearl);border-color:rgba(217,164,65,.4)}
  .chip[aria-pressed="true"]{background:var(--brass);color:var(--ink);border-color:var(--brass)}
  .chip.path[aria-pressed="true"]{background:#2f7d5b;color:#fff;border-color:#2f7d5b}
  .chip:focus-visible{outline:2px solid var(--brass-soft);outline-offset:2px}
  .chip .em{font-size:14px}

  .method{max-width:1080px;margin:20px auto 0;padding:0 20px}
  .method .mhead{font-family:var(--display);font-size:18px;font-weight:600;margin:0 0 3px}
  .method .msub{color:var(--muted);font-size:13.5px;margin:0 0 14px;max-width:60ch}
  .mgrid{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .mcard{background:var(--ink-2);border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:12px;padding:13px 15px}
  .mcard .mn{font-size:11px;font-weight:700;color:var(--brass);letter-spacing:.5px}
  .mcard h4{margin:5px 0 5px;font-size:14.5px;font-weight:600}
  .mcard p{margin:0;font-size:12.8px;color:#c4d0c8;line-height:1.5}
  .mcard code{font-family:var(--ui);background:var(--ink-3);color:var(--brass-soft);padding:1px 6px;border-radius:5px;font-size:12px}

  .scope{max-width:1080px;margin:16px auto -2px;padding:0 20px;color:var(--muted);font-size:12.5px}
  .tip{max-width:1080px;margin:18px auto 0;padding:0 20px}
  .today{max-width:1080px;margin:16px auto 0;padding:0 20px}
  .today[hidden]{display:none}
  .card.today-card{border-color:rgba(217,164,65,.45);background:linear-gradient(180deg,rgba(217,164,65,.07),rgba(217,164,65,0) 60%),var(--ink-2)}
  .card.today-card:hover{border-color:rgba(217,164,65,.6)}
  .today-lbl{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--brass);padding-right:34px}
  .today-eng{font-size:15px;color:#cdd8d1;margin-top:4px}
  .today-x{position:absolute;top:10px;right:11px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:transparent;border:0;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
  .today-x:hover{color:var(--pearl);background:var(--ink-3)}
  .today-said{font-family:var(--ui);font-size:13px;font-weight:700;padding:8px 15px;border-radius:9px;border:1px solid var(--brass);background:var(--brass);color:var(--ink);cursor:pointer}
  .today-said:disabled{background:var(--ink-3);border-color:var(--line);color:var(--muted);cursor:default}
  .today-count{margin-top:10px;font-size:12.5px;color:var(--muted)}
  .tip .inner{background:linear-gradient(180deg,var(--ink-3),var(--ink-2));border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:12px;padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
  .tip.path .inner{border-left-color:#2f7d5b}
  .tip .lbl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--brass);margin-bottom:3px}
  .tip.path .lbl{color:#5ec48f}
  .tip p{margin:0;font-size:14px;color:#cdd8d1}
  .tip .ic{font-size:18px;line-height:1.3}

  .grid{max-width:1080px;margin:0 auto;padding:18px 20px 70px;display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;position:relative;transition:border-color .15s}
  .card:hover{border-color:rgba(217,164,65,.35)}
  .card .eng{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.2px;padding-right:30px}
  .card{--ro-size:25px}
  .card .ro{font-size:var(--ro-size);font-weight:600;color:var(--pearl);line-height:1.3;margin:7px 0 3px}
  .card .te{font-family:var(--telugu);font-size:calc(var(--ro-size) * .85);font-weight:500;line-height:1.45;color:var(--brass-soft)}
  .card .hi{margin-top:7px;font-size:13px;color:var(--muted)}
  .card .hi b{color:#cdd8d1;font-weight:600}
  .card .hi .tag{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--brass);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-right:7px;text-transform:uppercase}
  .card .note{margin-top:11px;padding-top:9px;border-top:1px dashed var(--line-2);font-size:12px;color:var(--muted);line-height:1.5}
  .card .note code{font-family:var(--ui);background:var(--ink-3);color:var(--brass-soft);padding:1px 5px;border-radius:4px}
  .hyd{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;margin-top:6px;font-size:13px;color:var(--muted);line-height:1.4}
  .hyd .tag{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--brass);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-right:1px;text-transform:uppercase;align-self:center}
  .hyd-ro{color:#cdd8d1;font-weight:700}
  .hyd-te{font-family:var(--telugu);color:var(--brass-soft);font-size:14px}
  .hyd-say{align-self:center}
  .hyd-txt{font-size:12px}
  .flash .hyd{justify-content:center;max-width:440px;margin-top:-4px}
  .hb{margin-top:11px;padding-top:9px;border-top:1px dashed var(--line-2)}
  .hb-lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:4px}
  .hbrow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:baseline;column-gap:9px;padding:2px 0;line-height:1.35}
  .hb-ro{font-size:13px;font-weight:700;color:var(--pearl)}
  .hb-te{font-family:var(--telugu);font-size:16px;font-weight:500;color:var(--brass-soft);line-height:1.45}
  .card .hb-te{font-size:calc(var(--ro-size) * .85)}
  .hb-eng{font-size:12px;color:var(--muted);flex:1 1 auto;min-width:0}
  .hb-say{align-self:center}
  .flash .hb{width:100%;max-width:420px;text-align:left}
  .card .row{display:flex;align-items:center;gap:6px;margin-top:13px;flex-wrap:wrap}
  .speak{font-family:var(--ui);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;background:var(--ink-3);border:1px solid var(--line);color:var(--pearl);padding:7px 13px;border-radius:9px;cursor:pointer;transition:.15s}
  .speak:hover{border-color:var(--brass);color:var(--brass-soft)}
  .speak.on{background:var(--brass);border-color:var(--brass);color:var(--ink)}
  .speak:focus-visible{outline:2px solid var(--brass-soft);outline-offset:2px}
  .bdlink{font-family:var(--ui);font-size:12.5px;font-weight:600;background:var(--ink-3);border:1px solid var(--line);color:var(--muted);cursor:pointer;padding:7px 11px;display:inline-flex;align-items:center;gap:6px;transition:.15s;border-radius:9px}
  .bdlink:hover{color:var(--brass-soft);border-color:var(--brass)}
  .bdlink:focus-visible{outline:2px solid var(--brass-soft);outline-offset:2px}
  .fav{position:absolute;top:13px;right:13px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:transparent;border:0;cursor:pointer;color:var(--muted);transition:.15s;font-size:18px}
  .fav:hover{color:var(--brass-soft)}
  .fav[aria-pressed="true"]{color:var(--brass)}
  .fav:focus-visible{outline:2px solid var(--brass-soft);outline-offset:1px}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 20px;font-size:15px}
  .empty b{color:var(--pearl);font-weight:600}

  /* breakdown flyout */
  .overlay{position:fixed;inset:0;background:rgba(6,18,17,.74);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{background:var(--ink-2);border:1px solid var(--line);border-radius:20px;max-width:470px;width:100%;padding:24px;position:relative;transform:translateY(12px);transition:.2s;max-height:88vh;overflow:auto}
  .overlay.show .sheet{transform:none}
  .sheet .x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--ink-3);color:var(--muted);cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center}
  .sheet .x:hover{color:var(--pearl)}
  .sh-eyebrow{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--brass)}
  .sh-ro{font-size:28px;font-weight:600;margin:8px 0 2px;color:var(--pearl)}
  .sh-te{font-family:var(--telugu);font-size:19px;font-weight:500;color:var(--brass-soft)}
  .sh-eng{color:var(--muted);font-size:14px;margin-top:2px}
  .parts{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:20px 0 16px}
  .part{background:var(--ink-3);border:1px solid var(--line);border-radius:11px;padding:9px 13px;min-width:0}
  .part .pp{font-weight:700;font-size:14px;color:var(--pearl)}
  .part .pg{font-size:12px;color:var(--muted);margin-top:2px}
  .plus{align-self:center;color:var(--brass);font-weight:700;font-size:15px}
  .sh-lit{font-size:15px;color:var(--pearl);background:var(--ink-3);border-left:3px solid var(--brass);border-radius:10px;padding:11px 14px;margin-bottom:15px}
  .sh-lit b{color:var(--brass-soft);font-style:italic}
  .sh-casual{font-size:13px;color:#c4d0c8;background:var(--ink-3);border:1px dashed var(--line);border-radius:9px;padding:9px 13px;margin-bottom:15px}
  .sh-casual b{color:var(--brass-soft)}
  .sh-insight{font-size:13.5px;color:#c4d0c8;line-height:1.6}
  .sh-insight .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--brass);margin-bottom:6px}
  .sh-insight code{font-family:var(--ui);background:var(--ink-3);color:var(--brass-soft);padding:1px 5px;border-radius:4px}

  /* flashcards */
  .fc{max-width:680px;margin:0 auto;padding:26px 20px 80px}
  .fc-setup{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
  .fc-setup .eyebrow{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--brass)}
  .fc-setup h3{font-family:var(--display);font-size:24px;font-weight:600;margin:0}
  .fc-setup p{margin:0;color:var(--muted);font-size:14.5px;max-width:44ch}
  .deck-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
  .deck{font-family:var(--ui);font-size:14px;font-weight:600;cursor:pointer;background:var(--ink-2);border:1px solid var(--line);color:var(--pearl);padding:11px 18px;border-radius:11px;transition:.15s;display:flex;align-items:center;gap:8px}
  .deck:hover{border-color:var(--brass);color:var(--brass-soft)}
  .deck small{color:var(--muted);font-weight:500}
  .deck:focus-visible{outline:2px solid var(--brass-soft);outline-offset:2px}
  .progress{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .progress .track{flex:1;height:6px;border-radius:99px;background:var(--ink-2);overflow:hidden}
  .progress .fill{height:100%;background:var(--brass);border-radius:99px;transition:width .3s}
  .progress .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
  .progress .exit{margin-left:4px;background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;padding:4px 6px}
  .progress .exit:hover{color:var(--pearl)}
  .flash{background:var(--ink-2);border:1px solid var(--line);border-radius:22px;padding:48px 28px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;cursor:pointer;position:relative;transition:border-color .15s}
  .flash:hover{border-color:rgba(217,164,65,.35)}
  .flash .hint{position:absolute;top:16px;left:0;right:0;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  .flash .q{font-size:26px;font-weight:600;font-family:var(--display)}
  .flash .a-ro{font-size:34px;font-weight:600;line-height:1.25;color:var(--pearl)}
  .flash .a-te{font-family:var(--telugu);font-size:22px;font-weight:500;color:var(--brass-soft)}
  .flash .tap{font-size:13px;color:var(--muted)}
  .flash .speak{margin-top:4px}
  .flash .a-eng{font-family:var(--display);font-size:26px;font-weight:600;color:var(--pearl);line-height:1.25}
  .flash .catch-hear{font-size:17px;padding:15px 28px;border-radius:14px;margin-top:0}
  .flash .catch-hear svg{width:22px;height:22px}
  .fmode{margin-top:2px}
  .fc-actions{display:flex;gap:12px;margin-top:18px}
  .fc-actions button{flex:1;font-family:var(--ui);font-size:15px;font-weight:700;padding:14px;border-radius:13px;cursor:pointer;border:1px solid var(--line);transition:.15s}
  .again{background:var(--ink-2);color:var(--pearl)}
  .again:hover{border-color:var(--rose);color:var(--rose)}
  .know{background:var(--brass);color:var(--ink);border-color:var(--brass)}
  .know:hover{background:var(--brass-soft)}
  .fc-actions button:focus-visible{outline:2px solid var(--brass-soft);outline-offset:2px}
  .done{text-align:center;padding:30px 10px}
  .done .te{font-family:var(--telugu);font-size:40px;color:var(--brass);margin:10px 0}
  .done .big{font-family:var(--display);font-size:28px;font-weight:600;margin-bottom:6px}
  .done p{color:var(--muted);font-size:15px;margin:0 0 22px}
  .done button{font-family:var(--ui);font-weight:700;font-size:15px;padding:13px 26px;border-radius:12px;border:0;background:var(--brass);color:var(--ink);cursor:pointer}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink-3);border:1px solid var(--line);color:var(--pearl);padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:100;box-shadow:0 14px 40px -16px rgba(0,0,0,.7)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .credit{max-width:1080px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:12.5px;text-align:center}

  /* sentence builder */
  .brow{max-width:680px;margin:0 auto;display:flex;gap:12px;align-items:flex-start;padding:0 4px 14px}
  .blabel{flex:0 0 50px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--brass);padding-top:9px}
  .bpills{display:flex;flex-wrap:wrap;gap:8px}
  .bpill{font-family:var(--ui);font-size:14px;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;background:var(--ink-2);border:1px solid var(--line);color:var(--muted);transition:.15s}
  .bpill:hover{color:var(--pearl);border-color:rgba(217,164,65,.4)}
  .bpill.on{background:var(--brass);color:var(--ink);border-color:var(--brass)}
  .bpill.misfit{opacity:.35}
  .bpill.misfit:hover{opacity:.65}
  .bpill:focus-visible{outline:2px solid var(--brass-soft);outline-offset:2px}

  {id:"learn", tier:1, name:"Make them teach you", em:"🪜", tip:"The single biggest shortcut: every Telugu speaker around you is a free teacher if you ask. These eight phrases turn any auto ride or chai break into a lesson — and saying you're learning earns instant goodwill."},

  {id:"verbs", tier:1, name:"Power Verbs", em:"🔑", tip:"The trader's trick: don't conjugate. One usable form per verb, and let context do the rest. <b>kaavaali</b>, <b>ivvandi</b>, <b>undaa?</b> carry half your day."},
  {id:"frames",tier:1, name:"Question Frames", em:"🧩", tip:"These are slots. Put any English noun in front and you have a sentence: “water enta?”, “ATM ekkada?”. Six frames plus pointing equals a hundred questions."},
  {id:"glue",  tier:1, name:"Glue Words", em:"✅", tip:"Tiny words that keep a conversation moving. Bonus hack: stick “andi” on almost anything to make it polite — “raa” becomes “randi”."},
  {id:"first", tier:1, name:"First Words", em:"🙏", tip:"Five seconds of effort that buys instant goodwill. Two of these — “naaku telugu raadu” and “meeku inglish vacchaa?” — are your escape hatches when you're stuck."},
  {id:"autobase", tier:1, name:"Auto Survival", em:"🛺", tip:"The words that get you home. Say the place name in English, say <b>anna</b>, and these six do the rest. Left/right/straight are in Ears only — drivers understand the English."},
  {id:"ears", tier:1, name:"Ears only", em:"🎧", tip:"You don't need to SAY these — English works — but you'll HEAR them constantly. Learn to recognise them; don't spend speaking effort on them."},
  {id:"auto",  tier:2, name:"Autos & Directions", em:"🧭", tip:"Open with “meeter veeyandi”. If refused: “enta?” then “chaalaa ekkuva”. Builds on the Auto Survival words from Base."},

const BD = {
  "ivvandi":{lit:"Give + politely.",parts:[["ivvu","give"],["andi","respect marker"]],casual:"ivvu",insight:"The single most useful verb. Slot any noun in front and you're done: “water ivvandi”, “bil ivvandi”, “sanchi ivvandi”. The stem is <code>ivvu</code>; <code>+andi</code> only adds respect."},
  "randi":{lit:"Come + politely.",parts:[["raa","come"],["andi","respect marker"]],casual:"raa",insight:"A touch irregular: <code>raa</code> + andi squeezes into <code>randi</code>, not “raa-andi”. With friends, just <code>raa</code>. Same word, two registers — the ending is the dial."},
  "aapandi":{lit:"Stop + politely.",parts:[["aapu","stop"],["andi","respect marker"]],casual:"aapu",insight:"Watch the move: stem <code>aapu</code> → polite <code>aapandi</code>. Every verb here is built this way, so once you see it once you can build the rest yourself."},
  "cheppandi":{lit:"Tell + politely.",parts:[["cheppu","tell"],["andi","respect marker"]],casual:"cheppu",insight:"<code>+andi</code> is the respect marker; drop it with friends and juniors. Same verb, two registers."},

  "naaku telugu raadu":{lit:"To-me Telugu doesn't-come.",parts:[["naaku","to me"],["telugu","Telugu"],["raadu","doesn't come"]],insight:"Dravidian languages say “I don't know X” as “to me, X doesn't come.” Knowing is treated as something that <i>comes</i> to you — the same engine powers “meeku inglish vacchaa?”."},

/* ---------------- speech ---------------- */
let voices=[];
function loadVoices(){ try{ voices = window.speechSynthesis ? (speechSynthesis.getVoices()||[]) : []; }catch(e){ voices=[]; } }
if(window.speechSynthesis){ loadVoices(); try{ speechSynthesis.onvoiceschanged = loadVoices; }catch(e){} }
let warnedTTS=false, warnedVoice=false;
function ttsBlockedNote(){ if(warnedTTS) return; warnedTTS=true; toast("Audio is blocked in this preview \u2014 pronunciation works when you open the file directly or deploy it."); }
function pickVoice(){
  const te = voices.find(v=>v.lang==="te-IN") || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("te"));
  if(te) return {voice:te, lang:"te-IN", script:true};
  const en = voices.find(v=>v.lang==="en-IN") || voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("en")) || voices[0] || null;
  return {voice:en, lang:(en&&en.lang)||"en-IN", script:false};
}
function speak(te, ro, btn){
  const done=()=>{ if(btn) btn.classList.remove("on"); };
  const pre=(window.TWOLINGO_AUDIO||{})[te];
  if(pre){
    try{ if(btn) btn.classList.add("on"); const a=new Audio(pre); a.onended=done; a.onerror=done; a.play().catch(done); return; }
    catch(e){ done(); }
  }
  if(!('speechSynthesis' in window)){ ttsBlockedNote(); return; }
  const clear=()=>{ if(btn) btn.classList.remove("on"); };
  try{
    speechSynthesis.cancel();
    if(!voices.length) loadVoices();
    const pick=pickVoice();
    const text = pick.script ? te : (ro||te||"").replace(/[…().?!/]/g," ").replace(/\s+/g," ").trim();
    if(!text){ return; }
    const u = new SpeechSynthesisUtterance(text); u.lang=pick.lang; u.rate=.82;
    if(pick.voice) u.voice=pick.voice;
    if(!pick.script && !warnedVoice){ warnedVoice=true; toast("No Telugu voice on this device \u2014 pronunciation may be approximate."); }
    let started=false;
    if(btn) btn.classList.add("on");
    u.onstart=()=>{ started=true; };
    u.onend=clear;
    u.onerror=()=>{ clear(); ttsBlockedNote(); };
    speechSynthesis.speak(u);
    // sandboxed iframes block synthesis silently (no onstart/onend/onerror) — reset and notify
    setTimeout(()=>{ let sp=false; try{ sp=speechSynthesis.speaking; }catch(e){} if(!started && !sp){ clear(); ttsBlockedNote(); } }, 1100);
  }catch(e){ clear(); ttsBlockedNote(); }
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const stripHtml = s => String(s||"").replace(/<[^>]*>/g,"");
function matchQ(p){const q=state.q.toLowerCase();return p.eng.toLowerCase().includes(q)||p.ro.toLowerCase().includes(q)||p.te.includes(state.q)||catName(p.cat).toLowerCase().includes(q)||stripHtml(p.note).toLowerCase().includes(q);}

  if(state.tier===1) items.push({id:"day1",name:"Day 1",em:"🌱",path:true},{id:"day2",name:"Day 2",em:"🌿",path:true});
  items.push(...cats);
  chipsEl.innerHTML=items.map(c=>{
    const on=state.cat===c.id;
    const extra=c.id==="fav"&&state.fav.size?` (${state.fav.size})`:"";
    const cls="chip"+(c.path?" path":"");
    return `<button class="${cls}" data-cat="${c.id}" aria-pressed="${on}"><span class="em">${c.em}</span>${c.name}${extra}</button>`;
  }).join("");
}

function renderTip(){

  else { tipEl.style.display="none"; tipEl.innerHTML=""; }

function filtered(){
  if(state.cat==="fav"){ let l=P.filter(p=>state.fav.has(p.id)); if(state.q) l=l.filter(matchQ); return l; }
  // a non-empty query searches every phrase in every tier; state.cat is kept, so clearing the query restores the chip
  if(state.q) return P.filter(matchQ);
  if(state.cat==="day1") return P.filter(p=>DAY[p.ro]===1);
  if(state.cat==="day2") return P.filter(p=>DAY[p.ro]===2);
  let l=P.filter(p=>catTier(p.cat)===state.tier);
  if(state.cat!=="all") l=l.filter(p=>p.cat===state.cat);
  return l;
}

/* ---------------- today's line ----------------
   Same phrase for everyone on a given local date: day index since 2026-01-01,
   mod the Day 1 list followed by the Day 2 list (DAY order as written). */
const todayEl=document.getElementById("today");
const TODAY_EPOCH=new Date(2026,0,1);
const isoDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function todayPhrase(){
  const now=new Date(), mid=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const idx=Math.round((mid-TODAY_EPOCH)/86400000);          // round: DST days are 23/25h
  const keys=[...Object.keys(DAY).filter(k=>DAY[k]===1),...Object.keys(DAY).filter(k=>DAY[k]===2)];
  if(!keys.length) return null;
  const ro=keys[((idx%keys.length)+keys.length)%keys.length];
  return P.find(p=>p.ro===ro)||null;
}
function saidDates(){ try{ const a=JSON.parse(store.get("nt_said")||"[]"); return Array.isArray(a)?[...new Set(a.filter(x=>typeof x==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(x)))]:[]; }catch(e){ return []; } }
function renderToday(){
  const today=isoDate(new Date());
  const p=todayPhrase();
  if(!p || store.get("nt_todayhide")===today){ todayEl.hidden=true; todayEl.innerHTML=""; return; }
  todayEl.hidden=false;
  const said=saidDates(), n=said.length, done=said.includes(today);
  const hi=(state.hi&&HI[p.ro])?`<div class="hi"><span class="tag">हिं</span><b>${escapeHtml(HI[p.ro])}</b></div>`:"";
  todayEl.innerHTML=`<article class="card today-card" data-pid="${p.id}">
    <button class="today-x" data-todayhide aria-label="Hide today's line until tomorrow" title="Hide for today">×</button>
    <div class="today-lbl">Today's line · say it to one person</div>
    <div class="ro">${escapeHtml(p.ro)}</div>
    <div class="te">${p.te}</div>
    <div class="today-eng">${escapeHtml(p.eng)}</div>
    ${hi}
    ${dialectHtml(p)}
    <div class="row today-row">
      <button class="speak" data-todaysay aria-label="Hear ${escapeHtml(p.eng)}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg> Hear</button>
      <button class="today-said" data-said${done?" disabled":""}>${done?"Said today ✓":"I said it ✓"}</button>
    </div>
    <div class="today-count">${n?`${n} day${n===1?"":"s"} spoken`:"Start your first day"}</div>
  </article>`;
}
todayEl.addEventListener("click",e=>{
  const p=P[+(todayEl.querySelector("[data-pid]")||{dataset:{pid:-1}}).dataset.pid]; if(!p) return;
  const ds=e.target.closest("[data-dsay]"); if(ds){ sayDialect(ds); return; }
  const say=e.target.closest("[data-todaysay]"); if(say){ speak(p.te,p.ro,say); return; }
  if(e.target.closest("[data-said]")){
    const today=isoDate(new Date()), said=saidDates();
    if(!said.includes(today)){ said.push(today); store.set("nt_said",JSON.stringify(said)); }
    toast("శభాష్! That's the whole method — one real sentence a day.");
    renderToday(); return;
  }
  if(e.target.closest("[data-todayhide]")){ store.set("nt_todayhide",isoDate(new Date())); renderToday(); }
});

function deckList(){

function renderCards(){

    const t=TIERS.find(t=>t.n===state.tier);
    cardsRoot.innerHTML=`<div class="fc"><div class="fc-setup">

  const p=P[fc.deck[fc.i]];

  if(!fc.flipped){

      `;
  } else {
    face = `
        <div class="hint">${escapeHtml(catName(p.cat))}</div>
        ${catchMode?`<div class="a-eng">${escapeHtml(p.eng)}</div>`:""}
        <div class="a-ro">${escapeHtml(p.ro)}</div>
        <div class="a-te">${p.te}</div>
        ${dialectHtml(p)}
        ${catchMode?"":`<div class="eng" style="color:var(--muted);font-size:14px">${escapeHtml(p.eng)}</div>`}
        <button class="speak" data-sayflash="${p.id}">${FLASH_HEAR_SVG} Hear</button>
        ${hbHtml(p)}

  }
  cardsRoot.innerHTML=`<div class="fc">
    <div class="progress">
      <button class="exit" data-done="again" aria-label="Exit deck">‹ Decks</button>

    ${fc.flipped ? `<div class="fc-actions"><button class="again" data-grade="again">Again</button><button class="know" data-grade="know">Got it</button></div>`:""}
  </div>`;
  // Catch it: play the phrase once when each card first appears (tapping Hear replays)
  if(catchMode && !fc.flipped && fc.autoPlayed!==fc.i){
    fc.autoPlayed=fc.i;

function startDeck(deckId){
  let ids;
  if(deckId==="tierall") ids=P.filter(p=>catTier(p.cat)===state.tier).map(p=>p.id);
  else if(deckId==="day1") ids=P.filter(p=>DAY[p.ro]===1).map(p=>p.id);
  else if(deckId==="day2") ids=P.filter(p=>DAY[p.ro]===2).map(p=>p.id);
  else if(deckId==="fav") ids=P.filter(p=>state.fav.has(p.id)).map(p=>p.id);
  else ids=P.filter(p=>p.cat===deckId).map(p=>p.id);
  ids=shuffle(ids.slice());
  fc={deck:ids,total:ids.length,i:0,flipped:false,known:0};
  renderCards();
}

/* ---------------- sentence builder ---------------- */
const BNOUNS=[
  {eng:"water",te:"నీళ్ళు",ro:"neellu",pl:true},
  {eng:"this",te:"ఇది",ro:"idi"},
  {eng:"tea",te:"చాయ్",ro:"chaay"},
  {eng:"the bill",te:"బిల్",ro:"bil"},
  {eng:"change",te:"చిల్లర",ro:"chillara"},
  {eng:"a bag",te:"సంచి",ro:"sanchi"},
  {eng:"ATM",te:"ATM",ro:"ATM",keep:true},
  {eng:"auto",te:"ఆటో",ro:"aato"},
  {eng:"the room",te:"రూమ్",ro:"room",keep:true},
  {eng:"a ticket",te:"టికెట్",ro:"ticket",keep:true},
];
const BFRAMES=[
  {label:"how much?",te:"ఎంత?",ro:"enta?",mean:n=>`How much is ${theN(n)}?`},
  {label:"where?",te:"ఎక్కడ?",ro:"ekkada?",mean:n=>`Where is ${theN(n)}?`},
  {label:"I want",te:"కావాలి",ro:"kaavaali",mean:n=>`I want ${aN(n)}.`},
  {label:"do you have?",te:"ఉందా?",ro:"undaa?",pl:{te:"ఉన్నాయా?",ro:"unnaayaa?"},mean:n=>`Do you have ${aN(n)}?`},
  {label:"give me",te:"ఇవ్వండి",ro:"ivvandi",mean:n=>`Give me ${aN(n)}.`},
];
/* which nouns make sense with each frame (keyed by frame label → noun eng) */
const FIT={
  "how much?":["water","this","tea","the bill","auto","the room","a ticket"],
  "where?":["ATM","auto","the room","a ticket","water","tea"],
  "I want":["water","this","tea","the bill","change","a bag","auto","the room","a ticket"],
  "do you have?":["water","this","tea","change","a bag","the room","a ticket"],
  "give me":["water","this","tea","the bill","change","a bag","a ticket"],
};
/* English for the result line: chip labels stay short, articles are added here */
const bareN = n => n.eng.replace(/^(the|a|an) /,"");
const ART = {water:"",tea:"",change:"",this:"",bill:"the ",ATM:"the ",room:"a ",ticket:"a ",bag:"a ",auto:"an "};
const theN = n => n.eng==="this" ? "this" : "the "+bareN(n);
const aN = n => (ART[bareN(n)] ?? "")+bareN(n);
const fits = (n,f) => (FIT[f.label]||[]).includes(n.eng);
const buildForm = (n,f) => { const fr=(n.pl&&f.pl)?f.pl:f; return {te:n.te+" "+fr.te, ro:n.ro+" "+fr.ro, fro:fr.ro, flabel:f.label+(fr!==f?" (plural)":"")}; };
const VALID_PAIRS = BNOUNS.flatMap((n,i)=>BFRAMES.map((f,j)=>[i,j])).filter(([i,j])=>fits(BNOUNS[i],BFRAMES[j]));
const buildRoot=document.getElementById("build");
let buildState={noun:0,frame:0};
/* keep the selection a sensible pair: fix the side the user did NOT just pick.
   kept="noun"  -> first frame (BFRAMES order) whose FIT list has the noun
   kept="frame" -> first noun in that frame's FIT list */
function normalizeBuild(kept){
  const n=BNOUNS[buildState.noun], f=BFRAMES[buildState.frame];
  if(fits(n,f)) return;
  if(kept==="noun"){ const j=BFRAMES.findIndex(x=>fits(n,x)); if(j>=0) buildState.frame=j; }
  else { const first=(FIT[f.label]||[])[0]; const i=BNOUNS.findIndex(x=>x.eng===first); if(i>=0) buildState.noun=i; }
}
function renderBuild(){
  normalizeBuild("frame");
  const n=BNOUNS[buildState.noun], f=BFRAMES[buildState.frame];
  const form=buildForm(n,f), te=form.te, ro=form.ro;
  const nounPills=BNOUNS.map((x,i)=>{ const ok=fits(x,f); return `<button class="bpill${i===buildState.noun?' on':''}${ok?'':' misfit'}" data-noun="${i}"${ok?'':` title="Doesn't fit “${escapeHtml(f.label)}” — tap to switch frame"`}>${escapeHtml(x.eng)}</button>`; }).join("");
  const framePills=BFRAMES.map((x,i)=>{ const ok=fits(n,x); return `<button class="bpill${i===buildState.frame?' on':''}${ok?'':' misfit'}" data-frame="${i}"${ok?'':` title="Doesn't fit “${escapeHtml(n.eng)}” — tap to switch word"`}>${escapeHtml(x.label)}</button>`; }).join("");
  const keepNote=n.keep?`<div class="bkeep">No Telugu word needed for “${escapeHtml(n.eng)}” — say the English word right inside the Telugu frame. That code-switch is exactly what locals do every day.</div>`:"";
  buildRoot.innerHTML=`<div class="fc">
    <div class="fc-setup" style="margin-bottom:18px">
      <div class="eyebrow">Sentence builder</div>
      <h3>Pick a word. Pick a frame.</h3>
      <p>This is the whole trick: the frame stays fixed, you swap the word — and Telugu's order never breaks. Build a few and feel the pattern.</p>
    </div>
    <div class="brow"><div class="blabel">Word</div><div class="bpills">${nounPills}</div></div>
    <div class="brow"><div class="blabel">Frame</div><div class="bpills">${framePills}</div></div>
    ${keepNote}
    <div class="bresult">
      <div class="bmean">${escapeHtml(f.mean(n))}</div>
      <div class="bro">${escapeHtml(ro)}</div>
      <div class="bte">${te}</div>
      <div class="bassemble">
        <span class="bchip">${escapeHtml(n.ro)}<small>${escapeHtml(n.eng)}</small></span>
        <span class="bplus">+</span>
        <span class="bchip">${escapeHtml(form.fro)}<small>${escapeHtml(form.flabel)}</small></span>
      </div>
      <div class="brow2">
        <button class="speak" id="bsay" aria-label="Hear the sentence"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg> Hear it</button>
        <button class="bdice" id="bdice">🎲 Surprise me</button>
      </div>
    </div>
  </div>`;
}
buildRoot.addEventListener("click",e=>{
  const nb=e.target.closest("[data-noun]"); if(nb){ buildState.noun=+nb.dataset.noun; normalizeBuild("noun"); renderBuild(); return; }
  const fb=e.target.closest("[data-frame]"); if(fb){ buildState.frame=+fb.dataset.frame; normalizeBuild("frame"); renderBuild(); return; }
  const say=e.target.closest("#bsay"); if(say){ const form=buildForm(BNOUNS[buildState.noun],BFRAMES[buildState.frame]); speak(form.te, form.ro, say); return; }
  if(e.target.closest("#bdice")){ const [i,j]=VALID_PAIRS[Math.floor(Math.random()*VALID_PAIRS.length)]; buildState.noun=i; buildState.frame=j; renderBuild(); }
});

const scenRoot=document.getElementById("scen");
let scenState={active:null,step:0};
const HEAR_SVG='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>';
function renderScen(){
  if(scenState.active===null){
    const avail=SCEN.map((s,i)=>({s,i})).filter(o=>o.s.tier<=state.tier);
    const cards=avail.map(({s,i})=>`<button class="scen-card" data-scen="${i}"><span class="scbadge">Tier ${s.tier}</span><span class="se">${s.emoji}</span><span class="st">${escapeHtml(s.title)}</span><span class="ss">${escapeHtml(s.setting)}</span></button>`).join("");
    scenRoot.innerHTML=`<div class="fc"><div class="fc-setup" style="margin-bottom:14px">
      <div class="eyebrow">Scenarios · Tier ${state.tier} and below</div><h3>Walk through a real moment</h3>
      <p>Each scene only uses the Telugu you've reached — numbers stay in English, just like a real beginner. Raise your level in Phrasebook to unlock more.</p>
    </div><div class="scen-grid">${cards}</div></div>`;
    return;
  }
  const sc=SCEN[scenState.active];
  const atEnd=scenState.step>=sc.turns.length-1;
  const bubbles=sc.turns.slice(0,scenState.step+1).map((t,idx)=>{
    const hear=t.te?`<button class="sbhear" data-shear="${idx}" aria-label="Hear">${HEAR_SVG}</button>`:"";
    return `<div class="sbubble ${t.who}"><div class="sb-who">${escapeHtml(t.label)}</div><div class="sb-en">${escapeHtml(t.en)}</div>${t.ro?`<div class="sb-ro">${escapeHtml(t.ro)} ${hear}</div>`:""}${t.te?`<div class="sb-te">${t.te}</div>`:""}</div>`;
  }).join("");
  scenRoot.innerHTML=`<div class="fc">
    <div class="scen-head"><button class="exit" data-scendone aria-label="Back to scenarios">‹ Scenes</button><div class="scen-title">${sc.emoji} ${escapeHtml(sc.title)}</div><span class="count">${scenState.step+1}/${sc.turns.length}</span></div>
    <div class="scen-setting">${escapeHtml(sc.setting)}</div>
    <div class="scen-thread">${bubbles}</div>
    <div class="brow2">${atEnd?`<button class="know" data-scenrestart>Replay</button><button class="bdice" data-scendone>Another scene</button>`:`<button class="know" data-scennext>Next ›</button>`}</div>
  </div>`;
}
scenRoot.addEventListener("click",e=>{
  const o=e.target.closest("[data-scen]"); if(o){ scenState={active:+o.dataset.scen,step:0}; renderScen(); return; }
  if(e.target.closest("[data-scennext]")){ scenState.step++; renderScen(); return; }
  if(e.target.closest("[data-scenrestart]")){ scenState.step=0; renderScen(); return; }
  if(e.target.closest("[data-scendone]")){ scenState={active:null,step:0}; renderScen(); return; }
  const h=e.target.closest("[data-shear]"); if(h){ const t=SCEN[scenState.active].turns[+h.dataset.shear]; speak(t.te, t.ro, h); }
});

/* ---------------- welcome modal ---------------- */
function showWelcome(){
  document.getElementById("welcomeSheet").innerHTML=`<div class="sheet welcome" role="dialog" aria-modal="true" aria-label="Welcome">
    <button class="x" data-wclose aria-label="Close">×</button>
    <div class="w-glyph">తె</div>
    <div class="sh-eyebrow">Survival Telugu · Hyderabad</div>
    <h2 class="w-title">Land in Hyderabad. Start <em>speaking Telugu</em> by the weekend.</h2>
    <p class="w-sub">Built the way migrant traders pick up a city's language: speak broken on day one, keep the nouns English, and let every Telugu speaker around you teach you the rest.</p>
    <div class="w-mhead">The four tricks</div>
    <div class="mgrid">${METHOD.map(m=>`<div class="mcard"><div class="mn">${m.n}</div><h4>${m.h}</h4><p>${m.p}</p></div>`).join("")}</div>
    <button class="w-start" data-wclose>Start speaking &rarr;</button>
  </div>`;
  document.getElementById("welcome").classList.add("show");
}
function hideWelcome(){ const w=document.getElementById("welcome"); if(w.classList.contains("show")){ w.classList.remove("show"); store.set("nt_welcomed","1"); } }
document.getElementById("welcome").addEventListener("click",e=>{ if(e.target.id==="welcome"||e.target.closest("[data-wclose]")) hideWelcome(); });
document.getElementById("howBtn").addEventListener("click",showWelcome);

/* ---------------- events ---------------- */
document.getElementById("q").addEventListener("input",e=>{ state.q=e.target.value.trim(); renderBook(); });
document.getElementById("hiToggle").addEventListener("click",function(){ state.hi=!state.hi; this.setAttribute("aria-pressed",state.hi); if(!state.hi&&state.mode==="book"){} renderBook(); if(state.hi) toast("Hindi hints on — shown on Base-tier words"); });

tierbarEl.addEventListener("click",e=>{ const b=e.target.closest("[data-tier]"); if(!b)return; state.tier=+b.dataset.tier; state.cat="all"; renderBook(); });
chipsEl.addEventListener("click",e=>{ const b=e.target.closest("[data-cat]"); if(!b)return; state.cat=b.dataset.cat; renderBook(); });

grid.addEventListener("click",e=>{
  const fav=e.target.closest("[data-fav]");
  if(fav){ const id=+fav.dataset.fav; state.fav.has(id)?state.fav.delete(id):state.fav.add(id); saveFav(); renderBook(); return; }
  const bd=e.target.closest("[data-bd]");
  if(bd){ openBreakdown(+bd.dataset.bd); return; }
  const hbs=e.target.closest("[data-hbsay]");
  if(hbs){ sayHb(hbs); return; }
  const ds=e.target.closest("[data-dsay]");
  if(ds){ sayDialect(ds); return; }
  const say=e.target.closest("[data-say]");
  if(say){ const p=P[+say.dataset.say]; speak(p.te,p.ro,say); }
});

cardsRoot.addEventListener("click",e=>{
  const fm=e.target.closest("[data-fmode]"); if(fm){ flashMode=fm.dataset.fmode==="catch"?"catch":"say"; store.set("nt_flashmode",flashMode); renderCards(); return; }
  const deck=e.target.closest("[data-deck]"); if(deck){ startDeck(deck.dataset.deck); return; }
  const done=e.target.closest("[data-done]"); if(done){ fc=null; renderCards(); return; }
  const sayf=e.target.closest("[data-sayflash]"); if(sayf){ e.stopPropagation(); const p=P[+sayf.dataset.sayflash]; speak(p.te,p.ro,sayf); return; }
  const hbs=e.target.closest("[data-hbsay]"); if(hbs){ e.stopPropagation(); sayHb(hbs); return; }
  const ds=e.target.closest("[data-dsay]"); if(ds){ e.stopPropagation(); sayDialect(ds); return; }
  const grade=e.target.closest("[data-grade]");
  if(grade){ if(grade.dataset.grade==="know"){ if(fc.i<fc.total) fc.known++; /* first showing only: re-queued cards sit past fc.total */ } else fc.deck.push(fc.deck[fc.i]); fc.i++; fc.flipped=false; renderCards(); return; }
  const flash=e.target.closest("#flash"); if(flash && fc && !fc.flipped){ fc.flipped=true; renderCards(); }
});
cardsRoot.addEventListener("keydown",e=>{ if(e.target.id==="flash"&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); if(!fc.flipped){fc.flipped=true;renderCards();} } });

function setMode(m){
  state.mode=m;
  document.getElementById("book").hidden=m!=="book";
  document.getElementById("practice").hidden=m!=="practice";
  document.getElementById("m-book").setAttribute("aria-pressed",m==="book");
  document.getElementById("m-practice").setAttribute("aria-pressed",m==="practice");
  if(m==="book") renderBook(); else setSub(state.sub||"cards");
}
function setSub(sub){
  state.sub=sub;
  document.getElementById("cards").hidden=sub!=="cards";
  document.getElementById("build").hidden=sub!=="build";
  document.getElementById("scen").hidden=sub!=="scenarios";
  document.querySelectorAll("#subnav button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sub===sub));
  if(sub==="cards"){ fc=null; renderCards(); }
  else if(sub==="build") renderBuild();
  else renderScen();
}
document.getElementById("subnav").addEventListener("click",e=>{ const b=e.target.closest("[data-sub]"); if(b) setSub(b.dataset.sub); });
document.getElementById("m-book").onclick=()=>setMode("book");
document.getElementById("m-practice").onclick=()=>setMode("practice");

/* ---------------- init ---------------- */
loadFav();
renderBook();
if(!store.get("nt_welcomed")) showWelcome();
</script>
